
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sync Client</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #f5f5f5; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .status { font-weight: bold; color: #333; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; color: white; }
        .btn-start { background: #28a745; }
        .btn-stop { background: #dc3545; }
        .log-box { height: 200px; overflow-y: auto; background: #333; color: #0f0; padding: 10px; font-family: monospace; border-radius: 4px; }
        .log-item { margin: 2px 0; font-size: 12px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Sync Status</h2>
        <div id="statusIndicator" class="status">Click Start to Begin</div>
        <br>
        <button id="startBtn" class="btn btn-start">Start Sync</button>
        <button id="stopBtn" class="btn btn-stop" disabled>Stop Sync</button>
    </div>

    <div class="card">
        <h3>Activity Log</h3>
        <div id="logBox" class="log-box"></div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusInd = document.getElementById('statusIndicator');
        const logBox = document.getElementById('logBox');

        function log(msg) {
            const div = document.createElement('div');
            div.className = 'log-item';
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        startBtn.onclick = async () => {
            statusInd.textContent = "Starting...";
            const res = await window.electronAPI.startSync();
            if (res.success) {
                statusInd.textContent = "✅ Running";
                statusInd.style.color = "green";
                startBtn.disabled = true;
                stopBtn.disabled = false;
                log("Sync started.");
            }
        };

        stopBtn.onclick = async () => {
            statusInd.textContent = "Stopping...";
            await window.electronAPI.stopSync();
            statusInd.textContent = "🛑 Stopped";
            statusInd.style.color = "red";
            startBtn.disabled = false;
            stopBtn.disabled = true;
            log("Sync stopped.");
        };

        window.electronAPI.onSyncEvent((_event, { type, data }) => {
            let msg = "";
            if (type === 'add') msg = `📄 Added: ${data.data.path}`;
            if (type === 'change') msg = `📝 Changed: ${data.data.path}`;
            if (type === 'remove') msg = `🗑️ Removed: ${data.data.path}`;
            log(msg);
        });
    </script>
</body>
</html>
